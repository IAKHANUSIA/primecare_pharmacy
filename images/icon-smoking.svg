<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="smokeTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#f0fdf4"/>
  <!-- Cigarette body -->
  <rect x="12" y="36" width="30" height="8" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="12" y="36" width="8" height="8" rx="2" fill="#f59e0b"/>
